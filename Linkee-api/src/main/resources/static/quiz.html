<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Linkee 퀴즈방 테스트(통합본)</title>

    <!-- 외부 라이브러리 사용(허용): SockJS + STOMP -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <style>
        *{box-sizing:border-box}
        body{font-family:system-ui,-apple-system,Segoe UI,Roboto; background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;margin:0;padding:20px}
        .container{max-width:1400px;margin:0 auto}
        .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
        .card{background:#fff;border-radius:14px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
        .full{grid-column:1 / -1}
        h1,h2,h3{margin:0 0 16px}
        label{display:block;font-weight:600;margin:12px 0 6px;color:#444}
        input,select{width:100%;padding:10px 12px;border:2px solid #e5e7eb;border-radius:8px;font-size:14px}
        button{border:0;border-radius:10px;padding:10px 18px;cursor:pointer;font-weight:700;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;margin:6px 6px 0 0}
        button.secondary{background:linear-gradient(135deg,#36d1dc,#5b86e5)}
        button.danger{background:linear-gradient(135deg,#f093fb,#f5576c)}
        .status-badge{display:inline-block;padding:6px 12px;border-radius:999px;font-weight:700}
        .connected{background:#10b981;color:#fff}
        .disconnected{background:#ef4444;color:#fff}
        .room-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
        .room-card{background:linear-gradient(135deg,#f5f7fa,#c3cfe2);border-radius:12px;padding:16px;cursor:pointer;border:3px solid transparent;transition:.2s}
        .room-card:hover{transform:translateY(-3px);border-color:#667eea}
        .room-info{color:#555;font-size:13px;margin-top:6px}
        .hidden{display:none}
        .participants{background:#f0f4ff;border-radius:10px;padding:16px;margin-top:14px}
        .participant-item{background:#fff;border-radius:8px;padding:10px;margin:6px 0}
        .badge{border-radius:999px;padding:3px 10px;font-size:12px;margin-left:8px}
        .badge.owner{background:#f59e0b;color:#fff}
        .badge.ready{background:#10b981;color:#fff}
        .quiz-area{background:linear-gradient(135deg,#ffeaa7,#fdcb6e);border-radius:14px;padding:18px;margin-top:16px}
        .question-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
        .question-number{background:#fff;padding:8px 16px;border-radius:999px;font-weight:800}
        .timer{background:#e74c3c;color:#fff;padding:8px 16px;border-radius:999px;font-weight:800}
        .question-content{background:#fff;border-radius:10px;min-height:90px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;margin:12px 0;padding:20px}
        .options{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
        .option-btn{background:#fff;border:3px solid #e5e7eb;border-radius:10px;padding:16px;text-align:left;cursor:pointer}
        .option-btn:hover{border-color:#667eea;background:#667eea;color:#fff}
        .option-btn.selected{background:#10b981;border-color:#10b981;color:#fff}
        .result-box{background:#fff;border-radius:10px;padding:16px;margin-top:12px}
        .ranking-item{background:#f0f4ff;border-radius:8px;padding:12px;display:flex;justify-content:space-between;margin:8px 0}
        .ranking-item.first{background:linear-gradient(135deg,#ffd700,#ffed4e)}
        .ranking-item.second{background:linear-gradient(135deg,#c0c0c0,#e0e0e0)}
        .ranking-item.third{background:linear-gradient(135deg,#cd7f32,#daa520)}
        .submission-info{background:#e0f2fe;border-radius:8px;padding:12px;margin-top:10px;font-weight:700;color:#0369a1}
        .log{background:#0b1220;color:#93c5fd;border-radius:12px;height:320px;overflow:auto;padding:14px;font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas}
        .log-entry{padding:6px 10px;border-left:3px solid #93c5fd;margin:6px 0}
        .log-entry.error{border-left-color:#ef4444;color:#fecaca}
    </style>
</head>
<body>
<div class="container">
    <h1 style="color:#fff;text-align:center;margin-bottom:18px;">🎮 Linkee 퀴즈방 테스트(통합본)</h1>

    <div class="grid">
        <!-- 좌측: 인증/방 만들기/방 목록 -->
        <div>
            <div class="card">
                <h2>🔐 인증</h2>
                <label>JWT Token</label>
                <input id="jwtToken" type="text" placeholder="Bearer 또는 토큰만 입력해도 됩니다." />
                <div style="margin-top:10px">
                    <button onclick="connectWebSocket()">🔌 WebSocket 연결</button>
                    <button class="secondary" onclick="disconnectWebSocket()">⛔ 해제</button>
                </div>
                <div style="margin-top:8px">
                    <span id="connectionStatus" class="status-badge disconnected">연결 안됨</span>
                </div>
            </div>

            <div class="card">
                <h2>➕ 방 만들기</h2>
                <label>방 제목</label>
                <input id="roomTitle" value="테스트 퀴즈방"/>
                <label>카테고리</label>
                <select id="categoryId"><option>로딩 중…</option></select>
                <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px;">
                    <div>
                        <label>정원</label>
                        <input id="roomCapacity" type="number" value="5" min="2" max="10"/>
                    </div>
                    <div>
                        <label>문제 수</label>
                        <input id="roomQuizLimit" type="number" value="5" min="5" max="20"/>
                    </div>
                    <div>
                        <label>모드</label>
                        <select id="roomMode">
                            <option value="S">솔로</option>
                            <option value="G">그룹</option>
                        </select>
                    </div>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;">
                    <div>
                        <label>공개여부</label>
                        <select id="isPrivate">
                            <option value="N" selected>공개(N)</option>
                            <option value="Y">비공개(Y)</option>
                        </select>
                    </div>
                    <div>
                        <label>비공개 코드(선택)</label>
                        <input id="roomCode" placeholder="비공개일 때만 사용"/>
                    </div>
                </div>
                <div style="margin-top:10px">
                    <button onclick="createRoom()">방 만들기</button>
                </div>
            </div>

            <div class="card">
                <div style="display:flex;justify-content:space-between;align-items:center;">
                    <h2>📋 방 목록</h2>
                    <button class="secondary" onclick="loadRooms()">🔄 새로고침</button>
                </div>
                <div id="roomList" class="room-list">
                    <p style="color:#667085">좌측 상단에서 WS 연결 후 새로고침을 눌러주세요.</p>
                </div>
            </div>
        </div>

        <!-- 우측: 퀴즈방 -->
        <div>
            <div id="quizRoomSection" class="card hidden">
                <div style="display:flex;justify-content:space-between;align-items:center;">
                    <h2 id="currentRoomTitle">퀴즈방</h2>
                    <button class="danger" onclick="leaveRoom()">🚪 나가기</button>
                </div>

                <div class="participants">
                    <h3>👥 참가자 (<span id="participantCount">0</span>명)</h3>
                    <div id="participantList"></div>
                </div>

                <div style="margin-top:6px">
                    <button id="readyBtn" class="secondary" onclick="toggleReady()">✅ 준비 완료</button>
                    <button id="startBtn" class="" onclick="startQuiz()">🎬 게임 시작 (방장)</button>
                </div>

                <div id="quizArea" class="hidden">
                    <div class="quiz-area">
                        <div class="question-header">
                            <span id="questionNumber" class="question-number">문제 1/5</span>
                            <span id="timer" class="timer">⏱️ 30초</span>
                        </div>
                        <div style="text-align:center;margin-bottom:10px;">
                            <span id="categoryName" style="background:#fff;padding:8px 16px;border-radius:999px;font-weight:700;color:#667eea;">카테고리</span>
                        </div>
                        <div id="questionContent" class="question-content">문제가 여기에 표시됩니다</div>
                        <div id="optionsContainer" class="options"></div>
                    </div>

                    <div id="submissionInfo" class="submission-info hidden">
                        <span id="submissionText"></span>
                    </div>
                </div>

                <div id="resultArea" class="hidden">
                    <div class="result-box">
                        <h3>✅ 정답 공개!</h3>
                        <div style="background:#c8e6c9;padding:16px;border-radius:8px;margin:12px 0;">
                            <strong id="correctAnswer">정답: </strong>
                        </div>
                        <h4>참가자 결과:</h4>
                        <div id="userResults"></div>
                    </div>
                </div>

                <div id="rankingArea" class="hidden">
                    <div class="result-box">
                        <h2>🏆 최종 순위</h2>
                        <div id="rankingList"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card full">
        <div style="display:flex;justify-content:space-between;align-items:center;">
            <h3>📝 메시지 로그</h3>
            <button onclick="clearLog()">🗑️ 로그 지우기</button>
        </div>
        <div id="logContainer" class="log"></div>
    </div>
</div>

<script>
    // ====== 상수 / BASE 계산 ======
    const HOST = window.location.hostname;
    const VIEW_PORT = window.location.port;
    const API_PORT = (VIEW_PORT === '63342' || VIEW_PORT === '5500') ? '8080' : (VIEW_PORT || '8080');
    const BASE = `${location.protocol}//${HOST}:${API_PORT}`;
    const WS_EP = "/ws-stomp";
    const API_PREFIX = "/api/v1";

    // ====== 상태 ======
    let stompClient = null;
    let currentRoomId = null;
    let roomSubscription = null;
    let timerInterval = null;

    // ====== UI 유틸 ======
    function log(msg, isErr=false){
        const c = document.getElementById('logContainer');
        const div = document.createElement('div');
        div.className = `log-entry ${isErr ? 'error' : ''}`;
        const t = new Date().toLocaleTimeString();
        div.textContent = `[${t}] ${msg}`;
        c.appendChild(div);
        c.scrollTop = c.scrollHeight;
    }
    function clearLog(){
        document.getElementById('logContainer').innerHTML = '';
        log('로그 초기화');
    }
    function show(el){ el.classList.remove('hidden'); }
    function hide(el){ el.classList.add('hidden'); }

    function getHeaders(){
        const raw = (document.getElementById('jwtToken').value || '').trim();
        const auth = raw ? (raw.startsWith('Bearer ') ? raw : `Bearer ${raw}`) : '';
        return { 'Content-Type':'application/json', ...(auth ? { Authorization: auth } : {}) };
    }
    async function safeJson(res){
        const ct = res.headers.get('content-type') || '';
        const text = await res.text();
        if (!ct.includes('application/json')) {
            throw new Error(`JSON 아님(status=${res.status}): ${text.slice(0,120)}`);
        }
        try { return JSON.parse(text); } catch { throw new Error('JSON 파싱 실패'); }
    }
    function wsHeaders(){
        const raw = (document.getElementById('jwtToken').value || '').trim();
        return { Authorization: raw.startsWith('Bearer ') ? raw : `Bearer ${raw}` };
    }

    // ====== WebSocket ======
    function connectWebSocket(){
        const raw = (document.getElementById('jwtToken').value || '').trim();
        if(!raw){ return alert('JWT 토큰을 입력하세요'); }

        log(`WS 연결 시도 → ${BASE}${WS_EP}`);
        const sock = new SockJS(`${BASE}${WS_EP}`, null, {transports:['websocket','xhr-streaming','xhr-polling']});
        stompClient = Stomp.over(sock);
        stompClient.debug = null;

        stompClient.connect(wsHeaders(), frame => {
            log('✅ WebSocket 연결 성공');
            const badge = document.getElementById('connectionStatus');
            badge.textContent = '연결됨';
            badge.classList.remove('disconnected');
            badge.classList.add('connected');
            loadCategories();
            loadRooms();
        }, err => {
            log(`❌ WS 연결 실패: ${err}`, true);
            const badge = document.getElementById('connectionStatus');
            badge.textContent = '연결 실패';
            badge.classList.remove('connected');
            badge.classList.add('disconnected');
        });
    }
    function disconnectWebSocket(){
        if(stompClient?.connected){
            try{ stompClient.disconnect(()=>log('WS disconnected')); }catch{}
        }
    }

    // 공통: 방 활성화 + 구독
    function activateRoom(roomId, roomTitle){
        // 이전 구독 해제
        if (roomSubscription){
            try{ roomSubscription.unsubscribe(); }catch{}
            roomSubscription = null;
        }
        currentRoomId = roomId;

        // UI 활성화
        document.getElementById('currentRoomTitle').textContent = roomTitle || `룸 #${roomId}`;
        show(document.getElementById('quizRoomSection'));

        // 구독
        roomSubscription = stompClient.subscribe(`/sub/quiz-room/${roomId}`, (message) => {
            try {
                const data = JSON.parse(message.body);
                handleMessage(data);
            } catch(e){
                log('❌ 수신 파싱 실패', true);
            }
        });
        log(`📡 구독 시작: /sub/quiz-room/${roomId}`);

        // ✅ 초기 멤버 스냅샷
        fetchParticipants(roomId).catch(e => log(`초기 멤버 조회 실패: ${e.message}`, true));
    }

    // ====== REST ======
    async function loadCategories(){
        try{
            log('카테고리 목록 조회…');
            const res = await fetch(`${BASE}${API_PREFIX}/categories`, {headers:getHeaders()});
            if(!res.ok) throw new Error(`HTTP ${res.status}`);
            const payload = await safeJson(res);
            const categories = Array.isArray(payload) ? payload : (payload?.data ?? []);
            const sel = document.getElementById('categoryId');
            sel.innerHTML = categories.map(c=>`<option value="${c.categoryId}">${c.categoryName}</option>`).join('');
            log(`✅ 카테고리 ${categories.length}개`);
        }catch(e){ log(`❌ 카테고리 실패: ${e.message}`, true); }
    }

    async function loadRooms(){
        try{
            log('방 목록 조회…');
            const res = await fetch(`${BASE}${API_PREFIX}/quiz-rooms`, {headers:getHeaders()});
            if(!res.ok) throw new Error(`HTTP ${res.status}`);
            const result = await safeJson(res);
            const rooms = result?.data?.content ?? result?.data ?? result;
            const box = document.getElementById('roomList');
            if(!Array.isArray(rooms) || rooms.length===0){
                box.innerHTML = '<p style="color:#667085">방이 없습니다.</p>'; return;
            }
            const html = rooms.map(room=>{
                const categoryName = room.category?.categoryName || '미지정';
                const statusChip = room.roomStatus === 'W' ? '🟢 대기중' : (room.roomStatus === 'P' ? '🟡 진행중' : '⚫ 종료');
                const chipColor = room.roomStatus === 'W' ? '#10b981' : (room.roomStatus === 'P' ? '#f59e0b' : '#6b7280');
                return `
          <div class="room-card" onclick="joinRoom(${room.quizRoomId}, '${(room.roomTitle||'퀴즈방').replace(/'/g,"\\'")}')">
            <h3>${room.roomTitle}</h3>
            <div class="room-info">📁 ${categoryName}</div>
            <div class="room-info">👥 ${room.joinedCount}/${room.roomCapacity}명</div>
            <div class="room-info"><span style="background:${chipColor};color:#fff;padding:4px 10px;border-radius:999px">${statusChip}</span></div>
          </div>
        `;
            }).join('');
            box.innerHTML = html;
            log(`✅ 방 ${rooms.length}개`);
        }catch(e){ log(`❌ 방 목록 실패: ${e.message}`, true); }
    }

    // ✅ 현재 방 멤버 스냅샷 가져오기 (API 경로는 너희 서버에 맞춰 하나 고정)
    async function fetchParticipants(roomId){
        // 1) 방 상세가 멤버 포함이면 이걸로:
        const res = await fetch(`${BASE}${API_PREFIX}/quiz-rooms/${roomId}`, { headers:getHeaders() });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const payload = await safeJson(res);

        const participants =
            payload?.data?.participants ??
            payload?.participants ??
            payload?.data?.members ??
            payload?.members ?? [];

        updateParticipants(Array.isArray(participants) ? participants : []);
        log(`👥 초기 멤버 ${participants.length}명`);
    }

    async function createRoom(){
        const payload = {
            categoryId: Number(document.getElementById('categoryId').value),
            roomTitle: document.getElementById('roomTitle').value || '테스트 퀴즈방',
            roomCapacity: Number(document.getElementById('roomCapacity').value || 5),
            roomQuizLimit: Number(document.getElementById('roomQuizLimit').value || 5),
            roomMode: document.getElementById('roomMode').value,
            isPrivate: document.getElementById('isPrivate').value,
            roomCode: document.getElementById('roomCode').value || null
        };
        try{
            log('방 생성 요청…');
            const res = await fetch(`${BASE}${API_PREFIX}/quiz-rooms`, {
                method:'POST', headers:getHeaders(), body:JSON.stringify(payload)
            });
            const data = await safeJson(res);
            if(!data?.success) throw new Error(data?.message || '생성 실패');

            const newRoomId = data.data;
            log(`✅ 방 생성 완료 (id=${newRoomId})`);

            // 생성자는 이미 멤버이므로 즉시 UI 활성화 + 구독
            activateRoom(newRoomId, payload.roomTitle);

            // 목록 새로고침 + 초기 멤버 로드
            loadRooms();
            fetchParticipants(newRoomId).catch(()=>{});
        }catch(e){ log(`❌ 생성 실패: ${e.message}`, true); }
    }

    async function joinRoom(roomId, roomTitle){
        if(!stompClient?.connected) return alert('먼저 WebSocket에 연결하세요.');
        const maybeCode = prompt('비공개 방이면 입장 코드를 입력(공개면 취소/엔터):') || null;
        const body = { quizRoomId: roomId, roomCode: maybeCode };
        try{
            log(`방 입장 요청… (roomId=${roomId})`);
            const res = await fetch(`${BASE}${API_PREFIX}/room_members`, {
                method:'POST', headers:getHeaders(), body:JSON.stringify(body)
            });
            const data = await safeJson(res);
            if(!data?.success) throw new Error(data?.message || '입장 실패');

            // 정상 입장
            activateRoom(roomId, roomTitle);

            // ✅ 입장 직후 방 상세 정보 조회 → 참가자 목록 즉시 표시
            try {
                const res = await fetch(`${BASE}${API_PREFIX}/quiz-rooms/${roomId}`, { headers: getHeaders() });
                const payload = await safeJson(res);
                const members = payload?.data?.members || [];
                updateParticipants(members);
                log(`✅ 참가자 ${members.length}명 로드 완료`);
            } catch(e) {
                log(`❌ 참가자 목록 로드 실패: ${e.message}`, true);
            }

            // ✅ 숫자/멤버 즉시 갱신
            loadRooms();
            fetchParticipants(roomId).catch(()=>{});
        }catch(e){
            const msg = String(e?.message ?? '');
            if (/이미\s*참여|USER_ALREADY_IN_ROOM/i.test(msg)) {
                log(`ℹ️ 이미 참여중인 방 → UI만 활성화`, false);
                activateRoom(roomId, roomTitle);
                loadRooms();
                fetchParticipants(roomId).catch(()=>{});
            } else {
                log(`❌ 입장 실패: ${msg}`, true);
            }
        }
    }

    function leaveRoom(){
        if (roomSubscription){ try{ roomSubscription.unsubscribe(); }catch{} roomSubscription=null; }
        currentRoomId = null;

        hide(document.getElementById('quizRoomSection'));
        hide(document.getElementById('quizArea'));
        hide(document.getElementById('resultArea'));
        hide(document.getElementById('rankingArea'));
        stopTimer();
        log('🚪 방 나가기(프론트 상태 초기화)');
        loadRooms();
    }

    // ====== WS Publish ======
    function toggleReady(){
        if(!stompClient || !currentRoomId) return;
        stompClient.send(`/pub/quiz-room/${currentRoomId}`, wsHeaders(), JSON.stringify({
            type:'READY_TOGGLE', ready:true
        }));
        log('📤 READY_TOGGLE 전송');
    }
    function startQuiz(){
        if(!stompClient || !currentRoomId) return;
        stompClient.send(`/pub/quiz-room/${currentRoomId}`, wsHeaders(), JSON.stringify({type:'START_QUIZ'}));
        log('📤 START_QUIZ 전송');
    }
    function submitAnswer(evt, optionIndex){
        if(!stompClient || !currentRoomId) return;
        document.querySelectorAll('.option-btn').forEach(b=>b.classList.remove('selected'));
        if (evt?.target) evt.target.classList.add('selected');
        stompClient.send(`/pub/quiz-room/${currentRoomId}`, wsHeaders(), JSON.stringify({
            type:'SUBMIT_ANSWER', answerIndex: optionIndex
        }));
        log(`📤 SUBMIT_ANSWER 전송: ${optionIndex}`);
    }

    // ====== WS Subscribe 핸들러 ======
    function handleMessage(data){
        log(`📩 수신: ${data.type || '(no-type)'}`);
        switch(data.type){
            case 'MEMBER_UPDATED':
            case 'PARTICIPANT_LIST':
            case 'ROOM_STATE': {
                const d = data.data ?? data;
                const list = d.participants ?? d.members ?? d.roomMembers ?? [];
                updateParticipants(Array.isArray(list) ? list : []);
                break;
            }
            case 'QUESTION_STARTED':  displayQuestion(data.data); break;
            case 'ANSWER_SUBMITTED':  displaySubmission(data.data); break;
            case 'QUESTION_RESULT':   displayResult(data.data); break;
            case 'QUIZ_FINISHED':     displayRanking(data.data); break;
            case 'ERROR':             log(`❌ 에러: ${data.message}`, true); break;
        }
    }

    // ====== 화면 랜더링 ======
    function displayQuestion(d){
        show(document.getElementById('quizArea'));
        hide(document.getElementById('resultArea'));
        document.getElementById('submissionInfo').classList.add('hidden');

        document.getElementById('questionNumber').textContent = `문제 ${d.questionNumber}/${d.totalQuestions}`;
        document.getElementById('categoryName').textContent = d.categoryName;
        document.getElementById('questionContent').textContent = d.questionContent;

        const opts = d.options.map(opt=>`
      <button class="option-btn" onclick="submitAnswer(event, ${opt.optionIndex})">
        <strong>${opt.optionIndex}.</strong> ${opt.optionText}
      </button>
    `).join('');
        document.getElementById('optionsContainer').innerHTML = opts;

        startTimer(d.timeLimit || 30);
    }

    function displaySubmission(d){
        const box = document.getElementById('submissionInfo');
        box.classList.remove('hidden');
        document.getElementById('submissionText').textContent =
            `${d.userName}님이 제출했습니다 (${d.submittedCount}/${d.totalParticipants})`;
    }

    function displayResult(d){
        stopTimer();
        hide(document.getElementById('quizArea'));
        show(document.getElementById('resultArea'));
        document.getElementById('correctAnswer').textContent = `정답: ${d.correctOptionText}`;
        const html = d.userResults.map(u=>`
      <div class="participant-item">
        <span>${u.isCorrect ? '✅' : '❌'} ${u.userName}</span>
      </div>
    `).join('');
        document.getElementById('userResults').innerHTML = html;
    }

    function displayRanking(d){
        stopTimer();
        hide(document.getElementById('quizArea'));
        hide(document.getElementById('resultArea'));
        show(document.getElementById('rankingArea'));
        const html = d.rankings.map(r=>{
            const cls = r.rank===1?'first':(r.rank===2?'second':(r.rank===3?'third':''));
            const medal = r.rank===1?'🥇':(r.rank===2?'🥈':(r.rank===3?'🥉':`${r.rank}위`));
            return `
        <div class="ranking-item ${cls}">
          <span><strong>${medal} ${r.userName}</strong></span>
          <span>${r.correctCount}/${d.totalQuestions}</span>
        </div>
      `;
        }).join('');
        document.getElementById('rankingList').innerHTML = html;
    }

    // ====== 참가자 UI ======
    function updateParticipants(members){
        document.getElementById('participantCount').textContent = members.length;
        const html = members.map(m => `
      <div class="participant-item">
        <span>👤 ${m.memberNickname}
          ${m.owner ? '<span class="badge owner">방장</span>' : ''}
          ${m.ready ? '<span class="badge ready">준비완료</span>' : ''}
        </span>
      </div>
    `).join('');
        document.getElementById('participantList').innerHTML = html;
    }

    // ====== 타이머 ======
    function startTimer(seconds){
        stopTimer();
        let remain = seconds;
        const el = document.getElementById('timer');
        el.textContent = `⏱️ ${remain}초`;
        timerInterval = setInterval(()=>{
            remain--;
            el.textContent = `⏱️ ${remain}초`;
            if (remain<=0) stopTimer();
        }, 1000);
    }
    function stopTimer(){
        if (timerInterval){ clearInterval(timerInterval); timerInterval=null; }
    }

    // 초기 진입
    window.addEventListener('load', ()=>{
        log('🎮 테스트 페이지 로드 완료');
        log('순서: JWT 입력 → WS 연결 → 방 만들기/입장 → 진행');
        // 카테고리만 먼저 볼 수 있도록 호출(401이면 로그에 안내)
        loadCategories();
    });
    window.addEventListener('beforeunload', ()=>{
        if (stompClient?.connected) stompClient.disconnect();
    });

    /* 테스트 체크리스트:
     1) JWT 입력 → WS 연결 (상단 배지 녹색 확인)
     2) 카테고리/방 목록 조회(401/403이면 로그에서 원인 확인)
     3) 방 만들기 → 즉시 오른쪽 영역 활성화 + 구독되는지 확인
     4) 방 목록 클릭 → 이미 참여중이어도 UI 강제 활성화되는지 확인
     5) READY_TOGGLE/START_QUIZ/정답 제출 후 WS 수신 로그 확인
    */
</script>

</body>
</html>
