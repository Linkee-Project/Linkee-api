<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Linkee 공지사항</title>
    <link rel="stylesheet" href="notice.css" />
</head>
<body>
<header class="site-header">
    <div class="header-inner">
        <div class="logo">
            <div class="logo-mark" aria-hidden="true"></div>
            <span>Linkee 공지사항</span>
        </div>
        <div class="actions">
            <button class="btn btn-ghost" onclick="reloadNotices()">새로고침</button>
            <button id="homeBtn">홈으로</button>
            <!--  관리자만 표시되는 버튼 -->
            <button id="adminCreateBtn" class="btn btn-ghost" style="display:none" onclick="openCreateModal()">공지 등록</button>
        </div>
    </div>
</header>

<main class="container">
    <section class="card">
        <div class="hero">
            <div>
                <h1>공지 목록</h1>
                <p>링키 커뮤니티의 최신 소식과 안내를 확인하세요.</p>
            </div>
        </div>

        <div class="filters">
            <div class="search">
                <input id="q" type="search" placeholder="제목 검색 (클라이언트 필터)" oninput="filterClient()">
                <button class="btn btn-clear" onclick="clearSearch()">지우기</button>
            </div>
            <select id="size" class="select" onchange="changeSize(this.value)">
                <option value="10" selected>10개씩</option>
                <option value="20">20개씩</option>
                <option value="30">30개씩</option>
            </select>
        </div>

        <div id="list" class="notice-list"></div>

        <div class="pagination">
            <button class="page-btn" id="prev" onclick="goPage(-1)">이전</button>
            <button class="page-btn" id="next" onclick="goPage(1)">다음</button>
            <div class="page-info" id="pageInfo">0 / 0</div>
        </div>
    </section>
</main>

<!-- 상세 모달 -->
<div class="modal" id="modal">
    <article class="modal-card">
        <header class="modal-head">
            <span class="chip">공지</span>
            <h2 id="modalTitle">제목</h2>
            <button class="close" onclick="closeModal()">닫기</button>
        </header>
        <div class="modal-body" id="modalBody">불러오는 중…</div>
    </article>
</div>

<!-- 공지 등록 모달 -->
<div id="createModal" class="modal">
    <div class="modal-card">
        <div class="modal-head">
            <h3>공지 등록</h3>
            <button class="close" onclick="closeCreateModal()">닫기</button>
        </div>
        <div class="modal-body">
            <input id="createTitle" type="text" placeholder="공지 제목" style="width:100%; padding:8px; margin-bottom:10px; border:1px solid #ccc; border-radius:8px;">
            <textarea id="createContent" placeholder="공지 내용을 입력하세요" style="width:100%; height:150px; padding:8px; border:1px solid #ccc; border-radius:8px;"></textarea>
            <button class="btn btn-primary" style="margin-top:10px;" onclick="createNotice()">등록</button>
        </div>
    </div>
</div>


<div class="toast" id="toast">문제가 발생했습니다.</div>

<script src="notice.js"></script>
</body>
</html>
