<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linkee 회원가입</title>
    <link rel="stylesheet" href="signup.css" />
</head>
<body>
<div class="signup-wrapper">
    <div class="signup-card">
        <h1 class="logo">🔗 Linkee</h1>
        <p class="subtitle">회원가입하고 Linkee 서비스를 시작하세요</p>

        <!-- ✅ 일반 회원가입 폼 -->
        <form id="signupForm" onsubmit="handleSignup(event)">
            <input type="email" id="email" placeholder="이메일" required />
            <p id="email-error" class="error-message"></p>

            <input type="text" id="nickname" placeholder="닉네임" required />
            <input type="password" id="password" placeholder="비밀번호" required />
            <input type="password" id="confirm" placeholder="비밀번호 확인" required />

            <button type="submit" class="btn-primary glow">회원가입</button>
        </form>

        <p id="message" class="message"></p>

        <!-- ✅ 네이버 회원가입 -->
        <div class="social-login">
            <p>또는 SNS로 간편 회원가입</p>
            <a href="http://localhost:8080/oauth2/authorization/naver" class="naver-btn">
                <img src="/images/naver-logo.png" alt="네이버 로고" /> 네이버로 가입하기
            </a>
        </div>

        <p class="login-link">
            이미 계정이 있나요?
            <a href="/login/login.html">로그인</a>
        </p>
    </div>
</div>

<script src="signup.js"></script>
</body>
</html>
