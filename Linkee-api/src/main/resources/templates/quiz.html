<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Linkee Quiz WS Tester</title>
    <style>
        :root { --bg:#0b1020; --fg:#e7e9ee; --muted:#96a0b5; --card:#141b34; --accent:#7aa2ff; }
        *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,Segoe UI,Roboto,Apple SD Gothic Neo,Apple Color Emoji,Arial}
        h2{margin:0 0 8px} h3{margin:12px 0 6px;color:var(--accent)}
        .wrap{display:grid;grid-template-columns: 320px 1fr; gap:16px; padding:16px}
        .card{background:var(--card);border:1px solid #232b4a;border-radius:16px;padding:14px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
        .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
        input,select,button,textarea{background:#0e1530;color:var(--fg);border:1px solid #29335a;border-radius:10px;padding:8px 10px}
        button{cursor:pointer} button.primary{background:var(--accent);color:#0c1226;border:none}
        .grid{display:grid;gap:8px}
        .log{height:180px;overflow:auto;background:#0a0f22;border:1px solid #1f2746;border-radius:12px;padding:8px}
        .list{max-height:220px;overflow:auto;border:1px solid #1f2746;border-radius:12px}
        .list table{width:100%;border-collapse:collapse}
        .list th,.list td{padding:8px;border-bottom:1px solid #1f2746;text-align:left}
        .pill{display:inline-block;padding:2px 8px;border-radius:999px;background:#1a2343;color:#b8c4ff;font-size:12px}
        .q-box{border:1px solid #29335a;border-radius:12px;padding:10px}
        .opt{display:block;margin:6px 0;padding:6px;border-radius:8px;background:#0e1530}
        .hidden{display:none}
        .ok{color:#98ffa1} .warn{color:#ffd27a} .err{color:#ff9393}
        .mono{font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace}
        .muted{color:var(--muted)}
    </style>
</head>
<body>
<div class="wrap">
    <!-- LEFT: Controls -->
    <section class="card grid" style="gap:12px">
        <h2>① 연결 & JWT</h2>
        <div class="grid">
            <label>API Base URL
                <input id="apiBase" value="http://localhost:8080" />
            </label>
            <label>WS Endpoint (SockJS)
                <input id="wsPath" value="/ws-stomp" />
            </label>
            <label>Publish Prefix
                <input id="pubPrefix" value="/pub" />
            </label>
            <label>Subscribe Prefix
                <input id="subPrefix" value="/sub" />
            </label>
            <label>JWT (Bearer ... 없음, 순수 토큰만)
                <textarea id="jwt" rows="3" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."></textarea>
            </label>
            <div class="row">
                <button class="primary" id="btnConnect">Connect</button>
                <button id="btnDisconnect">Disconnect</button>
            </div>
            <div class="muted">CONNECT 시 Authorization 헤더로 <span class="mono">Bearer {token}</span> 전송합니다.</div>
        </div>

        <hr style="border-color:#1f2746">

        <h2>② 방 관리</h2>
        <div class="grid">
            <div class="row">
                <input id="roomTitle" placeholder="방 제목" style="flex:1">
                <select id="roomMode">
                    <option value="G">그룹(G)</option>
                    <option value="S">개인(S)</option>
                </select>
                <input id="roomCap" type="number" min="2" value="4" style="width:80px"/>
                <button id="btnCreate" class="primary">방 생성</button>
            </div>
            <div class="row">
                <button id="btnFetchRooms">모집중 방 새로고침</button>
                <span class="pill">status=W 만 조회</span>
            </div>
            <div id="rooms" class="list"></div>
            <div class="row">
                <input id="roomId" placeholder="선택된 roomId" style="flex:1"/>
                <button id="btnJoin" class="primary">참여</button>
            </div>
        </div>

        <hr style="border-color:#1f2746">

        <h2>③ 준비 & 시작</h2>
        <div class="row">
            <button id="btnReady">내 상태: Ready</button>
            <button id="btnUnready">취소</button>
            <button id="btnStart" class="primary">방장 시작</button>
        </div>
    </section>

    <!-- RIGHT: Live Area -->
    <section class="card grid" style="gap:12px">
        <h2>라이브 상태</h2>

        <div class="grid" style="grid-template-columns: 1fr 1fr; gap:12px">
            <div class="card" style="background:#0c1226">
                <h3>참여자 목록</h3>
                <div id="members" class="list"></div>
            </div>
            <div class="card" style="background:#0c1226">
                <h3>순위</h3>
                <div id="ranking" class="list"></div>
            </div>
        </div>

        <div class="q-box" id="questionBox">
            <div class="row" style="justify-content:space-between;align-items:center">
                <h3 id="qTitle">(문제 대기중)</h3>
                <span id="qMeta" class="pill">-/-</span>
            </div>
            <div id="qText" style="margin:6px 0 8px"></div>
            <form id="optForm"></form>
            <div class="row">
                <button id="btnSubmitAns" class="primary" disabled>정답 제출</button>
                <span id="ansStatus" class="muted"></span>
            </div>
        </div>

        <div>
            <h3>내 문제 풀이 기록</h3>
            <div id="review" class="list"></div>
        </div>

        <div>
            <h3>로그</h3>
            <div id="log" class="log mono"></div>
        </div>
    </section>
</div>

<!-- SockJS & Stomp (CDN) -->
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script>
    (() => {
        // ===== Configurable endpoints (프로젝트에 맞게 수정) =====
        const endpoints = {
            // REST
            createRoom: () => `${apiBase()}/api/quiz-rooms`, // POST {title, mode, capacity}
            getRooms: () => `${apiBase()}/api/quiz-rooms?status=W`, // GET
            joinRoom: (roomId) => `${apiBase()}/api/quiz-rooms/${roomId}/join`, // POST
            ready: (roomId) => `${apiBase()}/api/quiz-rooms/${roomId}/ready`, // POST {ready:true/false}
            // STOMP topics (백엔드 설정과 맞춰주세요)
            topicMembers: (roomId) => `${subPrefix()}/room.${roomId}.members`,
            topicQuestion: (roomId) => `${subPrefix()}/room.${roomId}.question`,
            topicRanking: (roomId) => `${subPrefix()}/room.${roomId}.ranking`,
            topicEnd: (roomId) => `${subPrefix()}/room.${roomId}.end`,
            // publish
            pubStart: (roomId) => `${pubPrefix()}/room/${roomId}/start`, // 메시지 바디: {}
            pubAnswer: (roomId) => `${pubPrefix()}/room/${roomId}/answer`, // {questionId, optionId}
        };

        // ===== Shortcuts to inputs =====
        const $ = (id) => document.getElementById(id);
        const apiBase = () => $("apiBase").value.trim();
        const wsPath = () => $("wsPath").value.trim();
        const pubPrefix = () => $("pubPrefix").value.trim();
        const subPrefix = () => $("subPrefix").value.trim();
        const token = () => $("jwt").value.trim();

        // ===== State =====
        let stomp = null;
        let connected = false;
        let currentRoomId = null;
        let currentQuestion = null;
        let review = []; // [{no, questionId, title, my, correct, isCorrect}]
        let questionIndex = 0, questionTotal = 0;

        // ===== Utils =====
        function log(msg, cls=""){
            const el = $("log");
            const time = new Date().toLocaleTimeString();
            const line = document.createElement("div");
            line.innerHTML = `[${time}] ${msg}`;
            if (cls) line.className = cls;
            el.appendChild(line); el.scrollTop = el.scrollHeight;
        }
        function authHeaders(){
            return { "Authorization": `Bearer ${token()}` };
        }
        async function http(method, url, body){
            const res = await fetch(url, { method, headers: {"Content-Type":"application/json", ...authHeaders()}, body: body? JSON.stringify(body): undefined });
            if(!res.ok){ const t = await res.text(); throw new Error(`${res.status} ${res.statusText}: ${t}`); }
            return res.status === 204 ? null : res.json();
        }
        function renderMembers(list){
            const box = $("members");
            const rows = (list||[]).map(m => `<tr><td>${m.userId||m.id}</td><td>${m.nickname||m.name||"-"}</td><td>${m.isReady? '✅': '⬜'}</td></tr>`).join("");
            box.innerHTML = `<table><thead><tr><th>ID</th><th>닉네임</th><th>Ready</th></tr></thead><tbody>${rows}</tbody></table>`;
        }
        function renderRanking(list){
            const box = $("ranking");
            const rows = (list||[]).map((r,i)=> `<tr><td>${i+1}</td><td>${r.nickname||r.name||r.userId}</td><td>${r.score}</td></tr>`).join("");
            box.innerHTML = `<table><thead><tr><th>#</th><th>사용자</th><th>점수</th></tr></thead><tbody>${rows}</tbody></table>`;
        }
        function renderRooms(rooms){
            const box = $("rooms");
            const rows = (rooms||[]).map(r => `<tr>
        <td>${r.quizRoomId||r.id}</td>
        <td>${r.roomTitle||r.title}</td>
        <td><span class="pill">${r.joinedCount||0}/${r.roomCapacity||r.capacity}</span></td>
        <td><button data-room="${r.quizRoomId||r.id}">선택</button></td>
      </tr>`).join("");
            box.innerHTML = `<table><thead><tr><th>ID</th><th>제목</th><th>인원</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
            box.querySelectorAll('button[data-room]').forEach(b=> b.onclick = ()=> { $("roomId").value = b.dataset.room; });
        }
        function renderQuestion(q){
            $("qTitle").textContent = q.questionTitle || q.title || `문제 ${questionIndex}/${questionTotal}`;
            $("qText").textContent = q.questionText || q.question || q.text || "";

            const opts = q.options || q.optionList || [];
            const form = $("optForm");
            form.innerHTML = opts.map(o => `
      <label class="opt">
        <input type="radio" name="ans" value="${o.optionId||o.id||o.index}">
        <span>${o.optionText || o.text}</span>
      </label>`).join("");
            $("btnSubmitAns").disabled = false;
            $("ansStatus").textContent = "";
        }
        function pushReview(row){
            const box = $("review");
            const rows = review.map(r => `<tr>
      <td>${r.no}</td><td class="mono">${r.questionId}</td><td>${r.title}</td>
      <td>${r.my}</td><td>${r.correct ?? '-'}</td><td>${r.isCorrect===true? '✅': r.isCorrect===false? '❌':'-'}</td>
    </tr>`).join("");
            box.innerHTML = `<table><thead><tr><th>No</th><th>QID</th><th>제목</th><th>내답</th><th>정답</th><th>판정</th></tr></thead><tbody>${rows}</tbody></table>`;
        }

        // ===== STOMP wiring =====
        function connectWS(){
            if(connected){ log('이미 연결됨', 'warn'); return; }
            const url = apiBase() + wsPath();
            const sock = new SockJS(url);
            stomp = Stomp.over(sock);
            // optional: stomp.debug = (m)=>console.log(m);
            stomp.connect({ Authorization: `Bearer ${token()}` }, () => {
                connected = true;
                log('WS CONNECTED ✅', 'ok');
                subscribeRoomFeeds(); // 방 선택되어 있으면 즉시 구독
            }, (err) => { log('WS ERROR: '+err, 'err'); });
        }
        function disconnectWS(){ if(stomp){ stomp.disconnect(()=>log('WS DISCONNECTED','warn')); } connected=false; }

        function subscribeRoomFeeds(){
            if(!connected || !currentRoomId) return;
            // 멤버 구독
            stomp.subscribe(endpoints.topicMembers(currentRoomId), (frame)=>{
                try{ const payload = JSON.parse(frame.body); renderMembers(payload.members||payload||[]); }
                catch(e){ log('members parse error: '+e, 'err'); }
            });
            // 문제 구독
            stomp.subscribe(endpoints.topicQuestion(currentRoomId), (frame)=>{
                try{
                    const payload = JSON.parse(frame.body);
                    currentQuestion = payload.question || payload;
                    questionIndex = payload.index || payload.no || (questionIndex+1);
                    questionTotal = payload.total || payload.totalCount || questionTotal;
                    $("qMeta").textContent = `${questionIndex}/${questionTotal || '?'}`;
                    renderQuestion(currentQuestion);
                    log(`문제 수신 QID=${currentQuestion.questionId||currentQuestion.id}`);
                }catch(e){ log('question parse error: '+e, 'err'); }
            });
            // 순위 구독
            stomp.subscribe(endpoints.topicRanking(currentRoomId), (frame)=>{
                try{ const payload = JSON.parse(frame.body); renderRanking(payload.ranking||payload||[]); }
                catch(e){ log('ranking parse error: '+e, 'err'); }
            });
            // 종료 구독
            stomp.subscribe(endpoints.topicEnd(currentRoomId), (frame)=>{
                log('게임 종료 이벤트 수신', 'warn');
                try{
                    const payload = JSON.parse(frame.body);
                    if(payload.finalRanking) renderRanking(payload.finalRanking);
                    if(payload.review){ review = payload.review; pushReview(); }
                }catch(e){ /* optional */ }
            });
        }

        // ===== Buttons =====
        $("btnConnect").onclick = connectWS;
        $("btnDisconnect").onclick = disconnectWS;

        $("btnCreate").onclick = async () => {
            try{
                const dto = { title: $("roomTitle").value, mode: $("roomMode").value, capacity: +$("roomCap").value };
                const res = await http('POST', endpoints.createRoom(), dto);
                log('방 생성 성공 id='+ (res.quizRoomId||res.id), 'ok');
                $("roomId").value = res.quizRoomId || res.id;
            }catch(e){ log('방 생성 실패 '+ e.message, 'err'); }
        };

        $("btnFetchRooms").onclick = async () => {
            try{ const res = await http('GET', endpoints.getRooms()); renderRooms(res.content||res||[]); }
            catch(e){ log('방 목록 실패 '+e.message, 'err'); }
        };

        $("btnJoin").onclick = async () => {
            const id = $("roomId").value.trim(); if(!id) return alert('roomId 입력');
            try{
                await http('POST', endpoints.joinRoom(id), {});
                currentRoomId = id; review = []; questionIndex=0; questionTotal=0; pushReview();
                log('방 참여 성공 roomId='+id, 'ok');
                if(connected) subscribeRoomFeeds();
            }catch(e){ log('참여 실패 '+e.message, 'err'); }
        };

        $("btnReady").onclick = async ()=> {
            const id = currentRoomId || $("roomId").value.trim(); if(!id) return alert('roomId');
            try{ await http('POST', endpoints.ready(id), { ready:true }); log('READY ✅', 'ok'); }
            catch(e){ log('ready 실패 '+e.message, 'err'); }
        };
        $("btnUnready").onclick = async ()=> {
            const id = currentRoomId || $("roomId").value.trim(); if(!id) return alert('roomId');
            try{ await http('POST', endpoints.ready(id), { ready:false }); log('UNREADY', 'warn'); }
            catch(e){ log('unready 실패 '+e.message, 'err'); }
        };

        $("btnStart").onclick = ()=> {
            if(!connected) return alert('WS 연결 필요');
            const id = currentRoomId || $("roomId").value.trim(); if(!id) return alert('roomId');
            stomp.send(endpoints.pubStart(id), authHeaders(), JSON.stringify({}));
            log('방장 시작 신호 전송', 'ok');
        };

        $("btnSubmitAns").onclick = (e)=>{
            e.preventDefault();
            if(!currentQuestion) return;
            const sel = document.querySelector('input[name="ans"]:checked');
            if(!sel) return alert('선택된 보기 없음');
            const optionId = sel.value;
            const roomId = currentRoomId || $("roomId").value.trim();
            // 리뷰에 임시 저장 (정답 여부/정답 텍스트는 서버 채점 이벤트에서 보강)
            review.push({ no: review.length+1, questionId: currentQuestion.questionId||currentQuestion.id, title: currentQuestion.questionTitle||currentQuestion.title||'', my: optionId });
            pushReview();

            // 전송
            stomp.send(endpoints.pubAnswer(roomId), authHeaders(), JSON.stringify({
                questionId: currentQuestion.questionId || currentQuestion.id,
                optionId
            }));
            $("ansStatus").textContent = '제출됨';
            $("btnSubmitAns").disabled = true;
        };

        // ===== OPTIONAL: 서버가 채점 결과를 별도 이벤트로 푸시하는 경우 예시 =====
        // stomp.subscribe(`${subPrefix()}/room.{roomId}.answer-result`, frame => { ... })

    })();
</script>
</body>
</html>
